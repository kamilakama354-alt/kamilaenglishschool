<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f4a37">
<title>KAMILA ENGLISH SCHOOL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--g:#2f4a37;--g2:#4a6b52;--g3:#e4ece0;--cream:#f4f2ea;--ink:#1f2d24;--muted:#6f7d73;--line:#e1e5da;--red:#a54b4b;--sh:0 12px 34px rgba(0,0,0,.3)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#1d3226,#101d15) fixed;background-color:#14241a;color:var(--ink);font-size:15px;line-height:1.6;min-height:100vh}
body,button,input,textarea,select,h1,h2,h3,p,label{font-family:'Comfortaa',sans-serif!important}
button{cursor:pointer}h1,h2,h3{font-weight:600;letter-spacing:-.5px;margin:0 0 8px}h2{font-size:24px}h3{font-size:17px}
.top{background:rgba(16,30,21,.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;color:#fff}
.brand{display:flex;align-items:center;gap:11px;min-width:0}.mark{width:42px;height:42px;border-radius:13px;background:var(--cream);color:var(--g);display:grid;place-items:center;font-size:19px;font-weight:800;flex:none}
.brand b{font-size:16px;display:block;line-height:1.2}.brand small{color:rgba(255,255,255,.65);font-size:12px}
.ua{display:flex;align-items:center;gap:9px}.dot{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center;font-weight:700}
main{max-width:1080px;margin:16px auto;padding:0 14px calc(24px + env(safe-area-inset-bottom))}
.card{background:var(--cream);border-radius:22px;padding:20px;box-shadow:var(--sh);margin-bottom:14px}
.muted{color:var(--muted)}.small{font-size:13px}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;font-size:10px;font-weight:700;opacity:.8}
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--g3);color:var(--ink);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--g);color:#fff}.btn.ghost{background:transparent;border:1px solid #cdd5c6}.btn.lt{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28)}.btn.danger{background:#f8eaea;color:var(--red)}.btn.sm{padding:8px 12px;font-size:13px}.btn:disabled{opacity:.5}
input,textarea,select{width:100%;border:1px solid #d3dacc;border-radius:12px;padding:12px 13px;background:#fff;color:var(--ink);font-size:15px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--g2);box-shadow:0 0 0 3px #dfeadb}textarea{min-height:120px;resize:vertical}
label{display:block;font-size:13px;font-weight:700;margin:4px 0 6px;color:#4c5e52}.f{margin-bottom:12px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}.hidden{display:none!important}.msg{font-size:13px;color:var(--muted);min-height:20px}
.hero{position:relative;overflow:hidden;color:#fff;border-radius:26px;padding:18px 18px;min-height:250px;display:flex;flex-direction:column;justify-content:space-between;margin-bottom:14px;box-shadow:var(--sh);background:linear-gradient(180deg,rgba(8,20,13,.6) 0%,rgba(8,20,13,.1) 45%,rgba(8,20,13,.8) 100%),url(hero.jpg) center 62%/cover,#2f4a37}
.hero h2{font-size:26px;margin:4px 0;color:#fff}.hero p{margin:0;opacity:.92;max-width:520px}.hero .search{background:#fff;border:0;max-width:520px}
#hres{background:#fff;border-radius:12px;margin-top:6px;overflow:hidden;max-width:520px;color:var(--ink)}#hres:empty{display:none}
.hit{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:0;border-bottom:1px solid var(--line);padding:11px 14px;font-weight:700}.hit small{display:block;color:var(--muted);font-weight:400}
.bigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:12px}
.big{display:flex;align-items:center;gap:13px;text-align:left;color:#fff;border-radius:20px;padding:14px 16px;min-height:80px;border:1px solid rgba(255,255,255,.16);background:linear-gradient(160deg,#4a6b52,#233a2b);box-shadow:var(--sh)}
.big span{font-size:28px}.big b{font-size:17px;display:block}.big small{opacity:.8;display:block;line-height:1.3}
.bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:11px;margin-top:12px}
.lc{border:1px solid var(--line);border-radius:15px;padding:13px;background:#fff;display:flex;flex-direction:column;gap:2px}.lc h3{margin:6px 0 2px}.lc p{margin:0 0 6px}
.pill{display:inline-block;background:var(--g3);color:var(--g);padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;width:max-content;margin-right:4px}.pill.off{background:#f1e9d4;color:#7a6530}
.seg{display:flex;gap:6px;margin:12px 0;background:var(--g3);padding:5px;border-radius:14px}.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px 6px;font-weight:700;color:var(--g)}.seg button.on{background:var(--g);color:#fff}
.story{white-space:pre-wrap;line-height:1.9;font-size:17px}.wr,.gap{padding:12px 14px;background:#fff;border:1px solid #e3e8dc;border-radius:12px;margin:8px 0}.gap.ok{background:#e8f3e6;border-color:#b6d7b0}.gap.bad{background:#fbeeee;border-color:#e3bcbc}.fb{font-size:13px;font-weight:700;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}.st{background:var(--g3);border-radius:16px;padding:14px}.st small{color:var(--muted);display:block}
.num{font-size:26px;font-weight:800;color:var(--ink);line-height:1.2}
details.fold{border:1px solid var(--line);border-radius:14px;margin:9px 0;background:#fff;overflow:hidden}details.fold>summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700}
.fr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;margin:0 8px 6px;background:#f4f6f0;border-radius:11px}.fr a{color:var(--g);font-weight:700;text-decoration:underline;cursor:pointer}
.ic{border:0;background:#f8eaea;color:var(--red);border-radius:9px;padding:6px 9px;font-size:13px}.empty{padding:22px;text-align:center;color:var(--muted);background:#fafbf8;border:1px dashed #d3dacc;border-radius:14px}
.sc{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;display:flex;justify-content:space-between;gap:8px;align-items:center;background:#fff;cursor:pointer}
#auth{border-radius:26px;overflow:hidden;padding:34px 16px 28px;color:#fff;box-shadow:var(--sh);background:linear-gradient(180deg,rgba(8,20,13,.65),rgba(8,20,13,.45)),url(hero.jpg) center 60%/cover,#2f4a37}
.ab{max-width:420px;margin:0 auto}.ac{text-align:center;margin-bottom:18px}.ac .mark{margin:0 auto 12px;width:56px;height:56px;font-size:25px}.ac h2{color:#fff}.ac p{margin:0;opacity:.9}
footer{text-align:center;color:rgba(255,255,255,.5);font-size:12px;padding:6px 0 0}
@media(max-width:600px){.g2{grid-template-columns:1fr}.hero h2{font-size:23px}.top{padding:10px 12px}.brand b{font-size:14px}}
</style>
</head>
<body>
<header class="top"><div class="brand" onclick="goHome()" style="cursor:pointer"><div class="mark">K</div><div><b>KAMILA ENGLISH SCHOOL</b><small>Learn with confidence ✨</small></div></div><div id="ua" class="ua hidden"><div id="dot" class="dot">K</div><button class="btn lt sm" onclick="signOut()">Sign out</button></div></header>
<main>
<section id="auth"><div class="ab"><div class="ac"><div class="mark">K</div><h2>Welcome!</h2><p class="muted">Your English learning space</p></div>
<div class="card"><div class="f"><label>Full name (for new account)</label><input id="fullName" autocomplete="name" placeholder="Your full name"></div>
<div class="f"><label>Email address</label><input id="email" type="email" autocomplete="username" placeholder="name@example.com"></div>
<div class="f"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters"></div>
<div class="row"><button class="btn pri" onclick="signIn()">Sign in</button><button class="btn" onclick="signUp()">Create account</button></div><p id="am" class="msg"></p></div></div></section>
<section id="app" class="hidden"><div id="view"></div></section>
</main>
<footer>KAMILA ENGLISH SCHOOL · Learn with confidence</footer>
<script>
const db=supabase.createClient("https://aidjhwgcnvoucozskghl.supabase.co","sb_publishable_C7PKJ6TvTYqsW1IMnK9g1A_UGcDORju");
const $=id=>document.getElementById(id);
const S={user:null,role:"student",name:"",lessons:[],results:[],people:[],view:"home",lid:null,ltab:"text",q:"",lv:"",month:"",sq:"",pid:null,editId:null};
let DAYS={};
const safe=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const msg=(id,t)=>{const e=$(id);if(e)e.textContent=t||""};
const pct=(s,t)=>t?Math.round(s/t*100):0;
const isT=()=>S.role==="teacher";
const sum=(a,k)=>a.reduce((s,r)=>s+(Number(r[k])||0),0);
const mk=d=>{d=new Date(d);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
const dk=d=>{d=new Date(d);return mk(d)+"-"+String(d.getDate()).padStart(2,"0")};
S.month=mk(new Date());

async function signIn(){const{data,error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error)return msg("am",error.message);await loadApp(data.user)}
async function signUp(){const n=$("fullName").value.trim(),e=$("email").value.trim(),p=$("password").value;
 if(!n||!e||!p)return msg("am","Please enter your name, email and password.");if(p.length<6)return msg("am","Password must be at least 6 characters.");
 const{data,error}=await db.auth.signUp({email:e,password:p,options:{data:{full_name:n}}});if(error)return msg("am",error.message);
 if(data.session)await loadApp(data.user);else msg("am","Account created. Check your email to confirm registration.")}
async function signOut(){await db.auth.signOut();location.reload()}

async function loadApp(user){
 S.user=user;const{data,error}=await db.from("profiles").select("role,full_name").eq("id",user.id).single();
 if(error||!data)return msg("am","Profile not found. Please contact your teacher.");
 S.role=data.role||"student";S.name=data.full_name||user.user_metadata?.full_name||user.email;
 $("auth").classList.add("hidden");$("app").classList.remove("hidden");$("ua").classList.remove("hidden");$("dot").textContent=(S.name[0]||"K").toUpperCase();
 await loadLessons();if(!isT())await loadMine();go("home")}
async function loadLessons(){const{data}=await db.from("lessons").select("*").order("created_at",{ascending:false});S.lessons=data||[]}
async function loadMine(){const{data}=await db.from("results").select("id,lesson_id,exercise,score,total,created_at").eq("student_id",S.user.id).order("created_at",{ascending:false});S.results=data||[]}
async function loadAll(){const[r,p]=await Promise.all([db.from("results").select("id,student_id,lesson_id,exercise,score,total,created_at").order("created_at",{ascending:false}),db.from("profiles").select("id,full_name,email,role")]);
 if(r.error||p.error){alert("Could not load results: "+(r.error||p.error).message);return}S.results=r.data||[];S.people=p.data||[]}

const vis=()=>S.lessons.filter(l=>isT()||l.published);
const person=id=>S.people.find(p=>p.id===id);
const nameOf=id=>{const p=person(id);return p?(p.full_name||p.email||"Student"):"Unknown"};
const ltitle=id=>{const l=S.lessons.find(x=>x.id===id);return l?l.title:"Deleted lesson"};

function go(v,x){S.view=v;if(x!==undefined)S.pid=x;render()}
async function goResults(){await loadAll();go("results")}
function goHome(){if(S.user)go("home")}
function render(){
 const v=S.view;let bar="";
 if(v!=="home"){const x=v==="lesson"?`<button class="btn lt sm" onclick="go('lessons')">← Lessons</button>`:v==="student"?`<button class="btn lt sm" onclick="goResults()">← Results</button>`:"";
  bar=`<div class="bar"><button class="btn lt sm" onclick="go('home')">🏠 Home</button>${x}</div>`}
 $("view").innerHTML=bar+({home:vHome,lessons:vLessons,lesson:vLesson,progress:vProgress,create:vCreate,results:vResults,student:vStudent})[v]();
 window.scrollTo({top:0})}

const first=()=>(S.name||"").split(" ")[0]||"friend";
function vHome(){
 const b=(f,i,t,x)=>`<button class="big" onclick="${f}"><span>${i}</span><div><b>${t}</b><small>${x}</small></div></button>`;
 return `<div class="hero"><div><span class="eyebrow">${isT()?"Teacher workspace":"Your learning journey"}</span><h2>Welcome, ${safe(first())}!</h2><p>${isT()?"Create lessons and follow your students' progress.":"Read, learn new words and practise every day."}</p></div>
 <div><input id="hs" class="search" placeholder="🔍 Search lesson by title..." oninput="homeSearch()"><div id="hres"></div></div></div>
 <div class="bigs">${isT()?b("go('lessons')","📚","Lessons","All reading lessons")+b("go('create')","✨","Generator","Create a lesson with AI")+b("goResults()","📊","Student results","Month, days and students"):b("go('progress')","📈","My progress","Scores, mistakes, completed texts")+b("go('lessons')","📚","Lessons","Text, vocabulary and practice")}</div>`}
function homeSearch(){const q=$("hs").value.trim().toLowerCase();
 $("hres").innerHTML=q?(vis().filter(l=>(l.title||"").toLowerCase().includes(q)).slice(0,6).map(l=>`<button class="hit" onclick="openLesson('${l.id}')">${safe(l.title)}<small>${safe(l.level||"")} · ${safe(l.topic||"")}</small></button>`).join("")||'<div class="hit">No lessons found</div>'):""}

const card=(l,mg)=>`<article class="lc"><div><span class="pill">${safe(l.level||"")}</span>${isT()&&!l.published?'<span class="pill off">Draft</span>':""}</div><h3>${safe(l.title)}</h3><p class="muted small">${safe(l.topic||"")}${l.group_name?" · "+safe(l.group_name):""}</p>
<div class="row" style="margin-top:auto">${mg?"":`<button class="btn pri sm" onclick="openLesson('${l.id}')">Open →</button>`}${isT()?`<button class="btn ghost sm" onclick="editLesson('${l.id}')">Edit</button>`:""}${mg?`<button class="btn danger sm" onclick="delLesson('${l.id}')">Delete</button>`:""}</div></article>`;
function listHtml(){const q=S.q.toLowerCase();const L=vis().filter(l=>(!S.lv||l.level===S.lv)&&(!q||(l.title||"").toLowerCase().includes(q)));return L.length?L.map(l=>card(l)).join(""):'<div class="empty" style="grid-column:1/-1">No lessons found.</div>'}
function vLessons(){return `<div class="card"><h2>Reading lessons</h2><p class="muted">Choose a lesson. Text, vocabulary and practice open with buttons.</p>
<div class="g2"><input value="${safe(S.q)}" placeholder="🔍 Search by lesson title..." oninput="S.q=this.value;$('list').innerHTML=listHtml()"><select onchange="S.lv=this.value;$('list').innerHTML=listHtml()"><option value="">All levels</option>${["A1","A2","B1","B2","C1"].map(x=>`<option ${S.lv===x?"selected":""}>${x}</option>`).join("")}</select></div>
<div id="list" class="grid">${listHtml()}</div></div>`}
function openLesson(id){S.lid=id;S.ltab="text";go("lesson")}
function setTab(t){S.ltab=t;render()}

function vLesson(){
 const l=S.lessons.find(x=>String(x.id)===String(S.lid));if(!l)return vLessons();
 const W=Array.isArray(l.words)?l.words:[],G=Array.isArray(l.gap_sentences)?l.gap_sentences:[],t=S.ltab;
 let body;
 if(t==="text")body=`<div class="story">${safe(l.story||"No text.")}</div>`;
 else if(t==="vocab")body=W.length?W.map(w=>`<div class="wr"><b>${safe(w.word)}</b> — ${safe(w.translation)}</div>`).join(""):'<div class="empty">No vocabulary yet.</div>';
 else body=G.length?G.map((g,i)=>`<div class="gap" id="gr${i}"><label>${i+1}. ${safe(g.sentence)}</label><input id="g${i}" autocomplete="off" autocapitalize="none" placeholder="Your answer"><div id="gf${i}" class="fb"></div></div>`).join("")+`<div class="row"><button id="chk" class="btn pri" onclick="checkGaps()">Check answers</button><button id="rt" class="btn ghost hidden" onclick="render()">Try again</button></div><p id="gm" class="msg" style="font-weight:700;color:var(--ink)"></p>`:'<div class="empty">No exercises yet.</div>';
 const sg=(k,n)=>`<button class="${t===k?"on":""}" onclick="setTab('${k}')">${n}</button>`;
 return `<div class="card"><span class="pill">${safe(l.level||"")}</span><h2 style="margin-top:8px">${safe(l.title)}</h2><p class="muted small">${safe(l.topic||"")}</p>
 <div class="seg">${sg("text","📖 Text")}${sg("vocab","🔤 Vocabulary")}${sg("practice","✍️ Practice ("+G.length+")")}</div>${body}</div>`}

async function checkGaps(){
 const l=S.lessons.find(x=>String(x.id)===String(S.lid));const G=l.gap_sentences||[];let ok=0;
 G.forEach((g,i)=>{const a=$("g"+i).value.trim().toLowerCase(),c=String(g.answer||"").trim().toLowerCase(),good=a===c;if(good)ok++;
  $("gr"+i).classList.add(good?"ok":"bad");$("g"+i).disabled=true;$("gf"+i).innerHTML=good?"✓ Correct":"✗ Correct answer: "+safe(g.answer)});
 $("chk").classList.add("hidden");$("rt").classList.remove("hidden");
 const m=`Score: ${ok} / ${G.length} · ${pct(ok,G.length)}% · Mistakes: ${G.length-ok}`;msg("gm",m);
 if(!isT()){const{error}=await db.from("results").insert({student_id:S.user.id,lesson_id:l.id,exercise:"fill_gaps",score:ok,total:G.length});
  msg("gm",error?m+" · Could not save: "+error.message:m+" · Result saved ✓");if(!error)await loadMine()}}

function lessonSummary(R){
 const by={};R.forEach(r=>{(by[r.lesson_id]=by[r.lesson_id]||[]).push(r)});
 const k=Object.keys(by);if(!k.length)return '<div class="empty">No completed texts yet.</div>';
 return k.map(id=>{const a=by[id],last=a[0],best=Math.max(...a.map(r=>pct(r.score,r.total)));
  return `<div class="sc" style="cursor:default"><div><b>${safe(ltitle(id))}</b><div class="muted small">Attempts: ${a.length} · Best: ${best}% · Last: ${last.score}/${last.total} · Mistakes (last): ${last.total-last.score}</div></div><div class="num">${pct(last.score,last.total)}%</div></div>`}).join("")}
function statCards(R){const s=sum(R,"score"),t=sum(R,"total");return `<div class="stats"><div class="st"><small>Overall score</small><div class="num">${pct(s,t)}%</div></div><div class="st"><small>Texts completed</small><div class="num">${new Set(R.map(r=>r.lesson_id)).size}</div></div><div class="st"><small>Mistakes</small><div class="num">${t-s}</div></div><div class="st"><small>Attempts</small><div class="num">${R.length}</div></div></div>`}
const history=(R,del)=>R.map(r=>{const d=new Date(r.created_at);return `<div class="fr" style="margin:6px 0"><div><b>${safe(ltitle(r.lesson_id))}</b><div class="muted small">${d.toLocaleDateString("en-GB")} ${d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}</div></div><div class="row" style="margin:0"><span class="num" style="font-size:18px">${r.score}/${r.total}</span>${del?`<button class="ic" onclick="delResults(['${r.id}'])">🗑</button>`:""}</div></div>`}).join("")||'<div class="empty">No attempts yet.</div>';
function vProgress(){return `<div class="card"><h2>My progress</h2><p class="muted">Your results, completed texts and mistakes.</p>${statCards(S.results)}<h3>Completed texts</h3>${lessonSummary(S.results)}<h3 style="margin-top:16px">Recent attempts</h3>${history(S.results.slice(0,15))}</div>`}

function vCreate(){return `<div class="card"><span class="eyebrow">AI generator</span><h2>Create a new story</h2><p class="muted">Write the level, topic, title and words. The AI writes the text and 10+ exercises.</p>
<div class="g2"><div class="f"><label>English level</label><select id="gLevel">${["A1","A2","B1","B2","C1"].map(x=>`<option>${x}</option>`).join("")}</select></div><div class="f"><label>Text title</label><input id="gTitle" placeholder="Example: The Lost Key"></div></div>
<div class="f"><label>What is the text about?</label><input id="gTopic" placeholder="Example: two friends find a mystery in the school garden"></div>
<div class="f"><label>New words — English = Russian, one per line</label><textarea id="gWords" placeholder="curious = любопытный&#10;forest = лес&#10;discover = обнаружить"></textarea></div>
<button class="btn pri" id="gBtn" onclick="generateStory()">✨ Generate story</button><p id="gm" class="msg"></p></div>
<div class="card"><h2 id="fh">Create a lesson</h2><input id="lId" type="hidden">
<div class="g2"><div class="f"><label>Lesson title *</label><input id="lTitle"></div><div class="f"><label>Level</label><select id="lLevel">${["A1","A2","B1","B2","C1"].map(x=>`<option>${x}</option>`).join("")}</select></div>
<div class="f"><label>Topic</label><input id="lTopic" placeholder="Animals, Travel..."></div><div class="f"><label>Group</label><input id="lGroup" placeholder="Group name (optional)"></div></div>
<div class="f"><label>Reading text *</label><textarea id="lStory" style="min-height:200px"></textarea></div>
<div class="g2"><div class="f"><label>Vocabulary — English = Russian</label><textarea id="lWords"></textarea></div><div class="f"><label>Fill gaps — sentence | answer (min 10)</label><textarea id="lGaps"></textarea></div></div>
<label style="display:flex;gap:8px;align-items:center"><input id="lPub" type="checkbox" checked style="width:auto"> Publish lesson for students</label>
<div class="row"><button id="sBtn" class="btn pri" onclick="saveLesson()">Save lesson</button><button id="cBtn" class="btn ghost hidden" onclick="resetForm()">Cancel editing</button></div><p id="tm" class="msg"></p>
<div class="empty small" style="margin-top:8px">Use <b>___</b> for the missing word, then | and the answer.</div></div>
<div class="card"><h2>Manage lessons</h2><div class="grid">${S.lessons.map(l=>card(l,true)).join("")||'<div class="empty">No lessons yet.</div>'}</div></div>`}

const pw=t=>t.split("\n").map(x=>x.trim()).filter(Boolean).map(x=>{const p=x.split("=");return{word:p[0].trim(),translation:p.slice(1).join("=").trim()}}).filter(x=>x.word&&x.translation);
const pg=t=>t.split("\n").map(x=>x.trim()).filter(Boolean).map(x=>{const p=x.split("|");return{sentence:p[0].trim(),answer:p.slice(1).join("|").trim()}}).filter(x=>x.sentence&&x.answer);

async function generateStory(){
 const level=$("gLevel").value,topic=$("gTopic").value.trim(),title=$("gTitle").value.trim(),wordsText=$("gWords").value,n=pw(wordsText).length;
 if(!topic)return msg("gm","Please write what the text is about.");if(n<3)return msg("gm","Please enter at least 3 words with translations.");if(n>30)return msg("gm","Please use no more than 30 words.");
 $("gBtn").disabled=true;msg("gm","AI is writing your story. Please wait about a minute...");
 try{const{data,error}=await db.functions.invoke("generate-story",{body:{level,topic,title,wordsText}});
  if(error){let d=error.message||"Request failed.";try{const b=await error.context.json();if(b.error)d=b.error}catch(e){}throw new Error(d)}
  if(!data||!data.story||!Array.isArray(data.gaps))throw new Error(data?.error||"Incomplete AI response.");
  $("lTitle").value=title||data.title||"New story";$("lLevel").value=level;$("lTopic").value=topic;$("lStory").value=data.story;
  $("lWords").value=(data.vocabulary||[]).map(v=>v.word+" = "+v.translation).join("\n");$("lGaps").value=data.gaps.map(g=>g.sentence+" | "+g.answer).join("\n");
  msg("gm",`Ready! Words: ${data.story.trim().split(/\s+/).length} · Exercises: ${data.gaps.length}. Check the lesson below and press Save.`);$("lTitle").scrollIntoView({behavior:"smooth",block:"center"})
 }catch(e){msg("gm","Generation failed: "+e.message)}finally{$("gBtn").disabled=false}}

async function saveLesson(){
 const id=$("lId").value,t=$("lTitle").value.trim(),st=$("lStory").value.trim(),gaps=pg($("lGaps").value);
 if(!t||!st)return msg("tm","Please enter a lesson title and reading text.");
 if(gaps.length<10&&!confirm("Only "+gaps.length+" exercises (minimum 10 recommended). Save anyway?"))return;
 const les={title:t,name:t,level:$("lLevel").value,topic:$("lTopic").value.trim(),group_name:$("lGroup").value.trim()||null,story:st,words:pw($("lWords").value),gap_sentences:gaps,published:$("lPub").checked};
 $("sBtn").disabled=true;msg("tm","Saving...");
 const r=id?await db.from("lessons").update(les).eq("id",id):await db.from("lessons").insert({...les,created_by:S.user.id});
 $("sBtn").disabled=false;if(r.error)return msg("tm",r.error.message);
 await loadLessons();go("create");msg("tm",id?"Lesson updated!":"Lesson created!")}
function resetForm(){S.editId=null;render()}
function editLesson(id){const l=S.lessons.find(x=>String(x.id)===String(id));if(!l)return;go("create");
 $("lId").value=l.id;$("fh").textContent="Edit lesson";$("sBtn").textContent="Save changes";$("cBtn").classList.remove("hidden");
 $("lTitle").value=l.title||"";$("lLevel").value=l.level||"A1";$("lTopic").value=l.topic||"";$("lGroup").value=l.group_name||"";$("lStory").value=l.story||"";
 $("lWords").value=(l.words||[]).map(w=>w.word+" = "+w.translation).join("\n");$("lGaps").value=(l.gap_sentences||[]).map(g=>g.sentence+" | "+g.answer).join("\n");$("lPub").checked=!!l.published;
 $("fh").scrollIntoView({behavior:"smooth"})}
async function delLesson(id){const l=S.lessons.find(x=>String(x.id)===String(id));if(!l||!confirm('Delete lesson "'+l.title+'"? This cannot be undone.'))return;
 const{error}=await db.from("lessons").delete().eq("id",id);if(error)return alert("Could not delete: "+error.message);await loadLessons();go("create")}

function monthRows(){const q=S.sq.trim().toLowerCase();return S.results.filter(r=>(!S.month||mk(r.created_at)===S.month)&&(!q||nameOf(r.student_id).toLowerCase().includes(q)||((person(r.student_id)||{}).email||"").toLowerCase().includes(q)))}
function resBody(){
 const R=monthRows();if(!R.length)return '<div class="empty">No results for this month / search.</div>';
 const by={};R.forEach(r=>{(by[r.student_id]=by[r.student_id]||[]).push(r)});
 const stu=Object.keys(by).sort((a,b)=>nameOf(a).localeCompare(nameOf(b))).map(id=>{const a=by[id];return `<div class="sc" onclick="go('student','${id}')"><div><b>${safe(nameOf(id))}</b><div class="muted small">Attempts: ${a.length} · Mistakes: ${sum(a,"total")-sum(a,"score")}</div></div><div class="row" style="margin:0"><div class="num">${pct(sum(a,"score"),sum(a,"total"))}%</div><button class="ic" onclick="event.stopPropagation();delStudent('${id}')">🗑</button></div></div>`}).join("");
 DAYS={};R.forEach(r=>{(DAYS[dk(r.created_at)]=DAYS[dk(r.created_at)]||[]).push(r)});
 const fold=Object.keys(DAYS).sort().reverse().map((k,i)=>{const a=DAYS[k],p=k.split("-"),lab=new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("en-US",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  return `<details class="fold" ${i?"":"open"}><summary><span>📁 ${lab}</span><span class="muted small">${new Set(a.map(r=>r.student_id)).size} students · ${a.length} attempts · ${pct(sum(a,"score"),sum(a,"total"))}%</span></summary>
  ${a.map(r=>{const d=new Date(r.created_at);return `<div class="fr"><div><a onclick="go('student','${r.student_id}')">${safe(nameOf(r.student_id))}</a><div class="muted small">${safe(ltitle(r.lesson_id))} · ${d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}</div></div><div class="row" style="margin:0"><span class="num" style="font-size:18px">${r.score}/${r.total}</span><button class="ic" onclick="delResults(['${r.id}'])">🗑</button></div></div>`}).join("")}
  <div style="padding:6px 8px 10px"><button class="btn danger sm" onclick="clearDay('${k}')">🗑 Clear this folder</button></div></details>`}).join("");
 return `${statCards(R)}<h3>Students</h3>${stu}<h3 style="margin-top:16px">Practice by day</h3>${fold}`}
function vResults(){return `<div class="card"><span class="eyebrow">Learning analytics</span><h2>Student results</h2><p class="muted">Progress for the selected month, grouped by days.</p>
<div class="g2"><input type="month" value="${S.month}" onchange="S.month=this.value;$('rb').innerHTML=resBody()"><input value="${safe(S.sq)}" placeholder="🔍 Search student by name..." oninput="S.sq=this.value;$('rb').innerHTML=resBody()"></div><div id="rb" style="margin-top:12px">${resBody()}</div></div>`}
function vStudent(){const id=S.pid,R=S.results.filter(r=>r.student_id===id),p=person(id)||{};
 return `<div class="card"><span class="eyebrow">Student profile</span><h2>${safe(nameOf(id))}</h2><p class="muted small">${safe(p.email||"")}</p>${statCards(R)}<div class="row" style="margin:0 0 10px"><button class="btn danger sm" onclick="delStudent('${id}')">🗑 Delete all results of this student</button></div><h3>Completed texts</h3>${lessonSummary(R)}<h3 style="margin-top:16px">Learning history</h3>${history(R,true)}</div>`}

async function delResults(ids,what){
 if(!ids.length)return alert("Nothing to delete.");
 if(!confirm("Delete "+(what||ids.length+" result(s)")+"? This cannot be undone."))return;
 const{data,error}=await db.from("results").delete().in("id",ids).select("id");
 if(error)return alert(/permission denied/i.test(error.message)?"Permission denied. Please run the updated supabase.sql in Supabase SQL Editor (it gives the teacher permission to delete), then try again.":"Could not delete: "+error.message);
 if(!data||!data.length)return alert("Nothing was deleted. Please run the updated supabase.sql in Supabase SQL Editor.");
 await loadAll();
 if(S.view==="student"&&!S.results.some(r=>r.student_id===S.pid))go("results");else render()}
function clearDay(k){const a=DAYS[k]||[];delResults(a.map(r=>r.id),"ALL "+a.length+" result(s) in this folder")}
function delStudent(id){const a=S.results.filter(r=>r.student_id===id).map(r=>r.id);delResults(a,"ALL "+a.length+" results of "+nameOf(id)+" (all months)")}

db.auth.getSession().then(({data})=>{if(data.session)loadApp(data.session.user)});
</script>
</body>
</html>
